<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cyber-green-vertical</title>
<style>
:root{
  --bg:#060807; --g:#22F59B; --g-deep:#0FA86E; --cyan:#2DE6E0; --ink:#fff; --mute:#7E8A84; --panel:#111513;
  --cjk:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"DejaVu Sans Mono","JetBrains Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:var(--cjk);color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
canvas{position:absolute;left:0;top:0}

/* ---------- spatial background ---------- */
#bg{width:1080px;height:1920px}
#flat{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:54px 54px;
  -webkit-mask-image:radial-gradient(ellipse 70% 45% at 50% 45%,#000,transparent 80%)}

/* ---------- world / scenes ---------- */
#world{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 44%}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;visibility:hidden;transform-style:flat}
.scene canvas{width:1080px;height:1920px;pointer-events:none}
.content{position:absolute;left:0;top:220px;width:1080px;height:1220px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.a{will-change:transform,opacity}

/* ---------- lens ---------- */
#fg{width:1080px;height:1920px}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 65% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.92) 100%)}

/* ---------- HUD ---------- */
#topic{position:absolute;left:72px;top:104px;transform:skewX(-16deg);background:var(--g);padding:8px 26px;border-radius:8px;box-shadow:0 0 30px rgba(34,245,155,.35)}
#topic span{display:block;transform:skewX(16deg);color:#04110b;font-weight:900;font-size:32px;letter-spacing:.04em}
#brand{position:absolute;right:72px;top:96px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:44px;letter-spacing:.04em;color:#e9efec}
#brand b{width:18px;height:44px;background:var(--g);transform:skewX(-16deg);border-radius:3px}
#prog{position:absolute;left:72px;right:72px;top:192px;height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--cyan));box-shadow:0 0 12px var(--g)}
#hudL,#hudR{position:absolute;top:212px;font:20px var(--mono);color:var(--mute);letter-spacing:.08em}
#hudL{left:72px}#hudR{right:72px}
#hudL b{color:var(--g)}
.rail{position:absolute;top:300px;height:1100px;width:16px;
  background:repeating-linear-gradient(180deg,rgba(34,245,155,.45) 0 2px,transparent 2px 22px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 15%,#000 85%,transparent)}
#railL{left:28px}#railR{right:28px}
.rail::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:rgba(34,245,155,.25)}
#railL::after{left:0}#railR::after{right:0}

#sub{position:absolute;left:60px;right:60px;top:1480px;height:170px;display:flex;align-items:center;justify-content:center;text-align:center}
#sub div{font-size:64px;font-weight:900;line-height:1.25;letter-spacing:.02em;text-shadow:0 4px 0 #000,0 0 6px #000,0 0 22px rgba(0,0,0,.95)}
.hl{color:var(--g);font-size:1.12em;padding:0 .08em;background:linear-gradient(180deg,transparent 64%,rgba(34,245,155,.30) 64%,rgba(34,245,155,.30) 92%,transparent 92%)}
#flash{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(34,245,155,.5),transparent 70%);opacity:0;mix-blend-mode:screen}

/* ---------- speaker camera ---------- */
#bg{z-index:0}#flat{z-index:0}#world{z-index:2}#fg{z-index:3}#vignette{z-index:4}
#cam{position:absolute;overflow:hidden;z-index:1;display:none;background:transparent}
#cam img{position:absolute;max-width:none;display:block}
#camshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,4,.88) 0%,rgba(2,6,4,.55) 18%,rgba(2,6,4,0) 34%,rgba(2,6,4,0) 64%,rgba(2,6,4,.55) 78%,rgba(2,6,4,.9) 100%)}
#camfx{z-index:6;pointer-events:none}
#railL,#railR,#topic,#brand,#prog,#hudL,#hudR,#sub,#flash{z-index:8}
.shead{position:absolute;left:72px;top:262px;z-index:2}
.shead b{display:block;font-size:46px;font-weight:900;line-height:1.15}
.shead i{display:block;font-style:normal;font:20px var(--mono);color:var(--g);letter-spacing:.14em;margin-top:6px}
.shead s{display:block;width:120px;height:5px;background:var(--g);margin-bottom:16px;box-shadow:0 0 14px var(--g)}
.warn{display:inline-flex;align-items:center;gap:16px;padding:10px 28px;border:3px solid var(--g);background:repeating-linear-gradient(-45deg,rgba(34,245,155,.22) 0 14px,rgba(0,0,0,.6) 14px 28px);font-size:40px;font-weight:900;box-shadow:0 0 30px rgba(34,245,155,.35)}
.otag{position:absolute;width:300px;padding:12px 22px;border-left:5px solid var(--g);background:rgba(4,10,7,.82);backdrop-filter:blur(6px)}
.otag b{display:block;font-size:36px;font-weight:900}.otag i{font-style:normal;font:17px var(--mono);color:var(--g);letter-spacing:.1em}
.brow{display:flex;align-items:center;gap:22px;padding:22px 0;border-bottom:2px dashed rgba(34,245,155,.25)}
.brow .ic{width:68px;height:68px;flex:none;border:3px solid var(--g);border-radius:12px;display:flex;align-items:center;justify-content:center;font:900 34px var(--mono);color:var(--g);background:rgba(34,245,155,.08)}
.brow .nm{font-size:44px;font-weight:900;line-height:1.1}.brow .nm i{display:block;font-style:normal;font:18px var(--mono);color:var(--mute);letter-spacing:.12em;margin-top:4px}
.brow .pr{margin-left:auto;font:900 52px var(--mono);color:var(--g);text-shadow:0 0 18px rgba(34,245,155,.5)}
.stamp{display:inline-block;transform:rotate(-8deg);border:5px solid var(--g);color:var(--g);font-size:44px;font-weight:900;padding:6px 26px;border-radius:10px;box-shadow:0 0 24px rgba(34,245,155,.4),inset 0 0 24px rgba(34,245,155,.2)}
.tbar{position:relative;width:170px;transform-origin:50% 100%;background:linear-gradient(180deg,#6BFFC6,var(--g) 40%,rgba(15,168,110,.35));box-shadow:0 0 40px rgba(34,245,155,.45);border-radius:6px 6px 0 0}
.tbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 3px,transparent 3px 12px)}
.pcard{width:400px;padding:30px 30px 26px;border:3px solid rgba(34,245,155,.4);border-radius:18px;background:rgba(6,12,9,.88);text-align:center;position:relative}
.pcard.new{border-color:var(--g);box-shadow:0 0 50px rgba(34,245,155,.3),inset 0 0 40px rgba(34,245,155,.1)}
.pcard .lb{font-size:34px;font-weight:900;color:#cfd8d4}.pcard .pv{font:900 76px var(--mono);margin-top:10px}
.pcard.old .pv{color:#8a958f}.pcard.new .pv{color:var(--g);text-shadow:0 0 24px rgba(34,245,155,.6)}
.strike{position:absolute;left:30px;right:30px;top:58%;height:6px;background:#ff4d5e;box-shadow:0 0 12px #ff4d5e;transform:rotate(-6deg)}

/* ---------- components ---------- */
.big3{position:relative;font-weight:900;line-height:1.02;letter-spacing:.02em;white-space:nowrap;
  background:linear-gradient(180deg,#5CFFC0 0%,var(--g) 45%,var(--g-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big3::before,.big3::after{content:attr(data-text);position:absolute;left:0;top:0;z-index:-1;background:none;-webkit-text-fill-color:transparent;-webkit-text-stroke:2.5px #fff}
.big3::before{transform:translate(7px,7px)}
.big3::after{transform:translate(14px,14px);opacity:.4}
.glow{color:var(--g);font-weight:900;text-shadow:0 0 18px rgba(34,245,155,.7),0 0 50px rgba(34,245,155,.4)}
.en{color:var(--mute);font-size:22px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.ptag{position:relative;transform:skewX(-14deg);border:4px solid var(--g);border-radius:20px;background:rgba(10,14,12,.92);
  box-shadow:0 0 40px rgba(34,245,155,.18),inset 0 0 40px rgba(34,245,155,.06)}
.ptag>.in{transform:skewX(14deg);display:flex;align-items:center;justify-content:space-between;gap:30px;padding:22px 44px}
.ptag .t{font-size:50px;font-weight:900;line-height:1.1}
.ptag .en{margin-top:6px}
.ptag svg{width:110px;height:92px;flex:none;color:var(--g)}
.mtag{position:absolute;width:420px;transform:skewX(-14deg);border:3px solid var(--g);border-radius:14px;background:rgba(9,13,11,.95);box-shadow:0 0 26px rgba(34,245,155,.2)}
.mtag>div{transform:skewX(14deg);padding:14px 28px}
.mtag b{display:block;font-size:40px;font-weight:900}
.mtag i{display:block;font-style:normal;font:18px var(--mono);color:var(--g);letter-spacing:.1em;opacity:.8}
.bubble{position:relative;display:inline-block;background:#050706;border:4px solid var(--g);border-radius:60px;padding:14px 42px;
  font-size:42px;font-weight:900;white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.bubble::after{content:"";position:absolute;bottom:-30px;right:80px;width:30px;height:30px;background:#050706;
  border-right:4px solid var(--g);border-bottom:4px solid var(--g);transform:skewY(40deg) rotate(10deg)}
.bubble.l::after{right:auto;left:80px;transform:skewY(-40deg) rotate(-10deg);border-right:none;border-left:4px solid var(--g)}
.lens{flex:none;border-radius:50%;background:radial-gradient(circle,rgba(10,26,19,.92),rgba(4,8,6,.96));box-shadow:inset 0 0 0 3px rgba(34,245,155,.35),inset 0 0 60px rgba(34,245,155,.12),0 0 60px rgba(0,0,0,.7)}
.win{position:relative;border:3px solid var(--g);border-radius:10px;background:rgba(8,12,10,.82);box-shadow:0 0 50px rgba(34,245,155,.12)}
.win .dots{position:absolute;left:24px;top:18px;display:flex;gap:10px}
.win .dots i{width:16px;height:16px;border-radius:50%;background:var(--g)}
.win .bar{position:absolute;left:0;right:0;top:52px;height:3px;background:var(--g);opacity:.7}
.vbox{border:2px solid rgba(34,245,155,.45);border-radius:14px;background:rgba(6,12,9,.85);box-shadow:inset 0 0 40px rgba(34,245,155,.08)}
.ring{position:relative;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,#000 55%,#0b1310 72%,#16201c 100%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #1d2723}
.ring::before{content:"";width:150px;height:150px;border-radius:50%;border:12px solid var(--g);box-shadow:0 0 30px var(--g),inset 0 0 30px var(--g)}
.pill{background:#151a18;border:3px solid #2a3430;border-radius:16px;padding:14px 40px;font-size:40px;font-weight:900;white-space:nowrap}
.node{width:104px;height:104px;border-radius:50%;border:4px solid var(--g);background:#06100b;display:flex;align-items:center;justify-content:center;
  font:900 38px var(--mono);color:var(--g);box-shadow:0 0 30px rgba(34,245,155,.35),inset 0 0 20px rgba(34,245,155,.2)}
.stepcard{width:660px;border-left:6px solid var(--g);background:linear-gradient(90deg,rgba(34,245,155,.14),rgba(34,245,155,0) 85%);padding:20px 34px}
.hbox{border:3px solid var(--g);padding:20px 30px;background:rgba(8,12,10,.85);min-width:250px}
.corner{position:absolute;width:70px;height:70px;border:6px solid var(--g)}
.dotframe{position:absolute;inset:40px 50px;border:3px dotted rgba(34,245,155,.45)}
.paper{position:relative;background:#fbfbf8;color:#111;padding:40px 40px 32px;box-shadow:0 40px 90px rgba(0,0,0,.8),0 0 0 2px rgba(255,255,255,.4)}
.badge{display:inline-block;background:var(--g);color:#04110b;font-weight:900;font-size:40px;padding:6px 22px;border-radius:8px}
.zero{position:relative;display:inline}
.zero::after{content:"";position:absolute;left:12%;right:12%;top:46%;height:.13em;background:#5CFFC0;transform:rotate(-38deg);border-radius:.06em}
.numtxt{font-weight:900;line-height:1;background:linear-gradient(180deg,#6BFFC6,var(--g) 50%,#12C9A0);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(34,245,155,.45))}
.box{border:3px solid var(--g);background:rgba(15,168,110,.16);padding:16px 30px;text-align:center;font-size:36px;font-weight:700;color:#b9ffe0}
.box small{display:block;font:20px var(--mono);letter-spacing:.12em;color:var(--g);opacity:.85}
.stack3d{position:relative;width:640px;height:880px;perspective:1500px}
.stk{position:absolute;left:60px;top:300px;width:520px;height:520px;transform-style:preserve-3d}
.stk .a{position:absolute;inset:0;transform-style:preserve-3d;will-change:auto}
.plate{position:absolute;inset:0;border:3px solid var(--g);
  background:linear-gradient(rgba(34,245,155,.22) 2px,transparent 2px) 0 0/52px 52px,linear-gradient(90deg,rgba(34,245,155,.22) 2px,transparent 2px) 0 0/52px 52px,
  linear-gradient(135deg,rgba(34,245,155,.30),rgba(15,168,110,.05));box-shadow:0 0 40px rgba(34,245,155,.35)}
.plate .mv{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 0 14px 6px var(--g)}
.plate .lb{position:absolute;left:18px;top:14px;font:900 30px var(--cjk);color:#fff;opacity:.9}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="flat"></div>
  <div id="cam"><img id="camimg"><div id="camshade"></div></div>
  <div id="world"></div>
  <canvas id="camfx" width="1080" height="1920"></canvas>
  <canvas id="fg" width="1080" height="1920"></canvas>
  <div id="vignette"></div>
  <div id="railL" class="rail"></div><div id="railR" class="rail"></div>
  <div id="topic"><span></span></div>
  <div id="brand"><b></b><span></span></div>
  <div id="prog"><i></i></div>
  <div id="hudL"></div><div id="hudR"></div>
  <div id="sub"><div></div></div>
  <div id="flash"></div>
</div>
<script>
// ============ math / helpers ============
const TAU=Math.PI*2, G="#22F59B";
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eOut=p=>1-Math.pow(1-p,3);
const eIO=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const ga=a=>`rgba(34,245,155,${a})`;
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const hl=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="hl">$1</span>');
const MONO='"DejaVu Sans Mono",monospace';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const A=(type,d,html,style="",u)=>`<div class="a" data-a="${type}" data-d="${d}" data-u="${u??(type==='type'?1.6:type==='draw'?1.2:type==='count'?1.4:.55)}" style="${style}">${html}</div>`;
let CALM=true,FOCUS=null; const KEY=h=>h.replace('class="a"','class="a key"'),DIM=h=>h.replace('class="a"','class="a dim"');
let CUR=null; const fx=(type,P={})=>{CUR.push(Object.assign({type},P));return""};
const bigSize=(t,max=300,w=900)=>{const n=Math.max(...String(t).split(/\\n|\n/).map(s=>[...s].length));return Math.min(max,Math.floor(w/Math.max(1,n)))};
const zeroes=s=>esc(s);

const ICONS={
 camera:`<svg viewBox="0 0 130 110" fill="currentColor"><path d="M8 30 L92 6 L104 40 L20 64 Z"/><rect x="96" y="20" width="22" height="16" rx="3" transform="rotate(-16 107 28)"/><path d="M40 60 L52 56 L60 80 L48 84Z"/><rect x="40" y="82" width="34" height="10" rx="5"/><circle cx="76" cy="96" r="9" fill="none" stroke="currentColor" stroke-width="6"/></svg>`,
 chip:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="5"><rect x="40" y="30" width="50" height="50" fill="currentColor"/>${[0,1,2,3].map(i=>`<path d="M${48+i*11} 30V12M${48+i*11} 80V98M40 ${38+i*11}H18M90 ${38+i*11}H112"/>`).join("")}</svg>`,
 radar:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="5"><circle cx="65" cy="55" r="44"/><circle cx="65" cy="55" r="24"/><path d="M65 55 L100 28" stroke-width="7"/><circle cx="88" cy="70" r="6" fill="currentColor"/></svg>`,
 doc:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="5"><path d="M34 6H82L100 24V104H34Z"/><path d="M82 6V24H100M46 44H88M46 60H88M46 76H74"/></svg>`,
 bolt:`<svg viewBox="0 0 130 110" fill="currentColor"><path d="M74 4 L30 62 H62 L52 106 L100 42 H68Z"/></svg>`,
 globe:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="5"><circle cx="65" cy="55" r="46"/><ellipse cx="65" cy="55" rx="20" ry="46"/><path d="M19 55H111M26 32H104M26 78H104"/></svg>`,
 user:`<svg viewBox="0 0 130 110" fill="currentColor"><circle cx="65" cy="34" r="24"/><path d="M20 106 Q22 62 65 62 Q108 62 110 106Z"/></svg>`,
 lock:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="7"><rect x="30" y="48" width="70" height="56" rx="8" fill="currentColor"/><path d="M44 48V32a21 21 0 0 1 42 0V48"/></svg>`,
 cloud:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="6"><path d="M34 84a22 22 0 0 1 2-44a30 30 0 0 1 57 6a19 19 0 0 1 3 38Z"/><path d="M48 96l-6 10M68 96l-6 10M88 96l-6 10"/></svg>`,
mini:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="6"><rect x="12" y="40" width="106" height="40" rx="12"/><path d="M24 80v8M106 80v8"/><circle cx="96" cy="60" r="4" fill="currentColor"/></svg>`,
 phone:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="6"><rect x="42" y="4" width="48" height="102" rx="10"/><rect x="50" y="14" width="18" height="18" rx="5" fill="currentColor"/><path d="M58 96h16"/></svg>`,
 card:`<svg viewBox="0 0 130 110" fill="none" stroke="currentColor" stroke-width="6"><rect x="10" y="22" width="110" height="70" rx="10"/><path d="M10 44h110" stroke-width="12"/><path d="M24 74h30"/></svg>`,
 x:`<svg viewBox="0 0 100 100" stroke="currentColor" stroke-width="12" stroke-linecap="round"><path d="M28 28L72 72M72 28L28 72"/></svg>`,
 check:`<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M22 52L42 72L80 30"/></svg>`,
 "!":`<svg viewBox="0 0 100 100" fill="currentColor"><rect x="43" y="18" width="14" height="44" rx="7"/><circle cx="50" cy="78" r="8"/></svg>`,
};
const icon=k=>ICONS[k]||"";

// ============ canvas FX library (deterministic in time) ============
function circle(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU);c.stroke()}
function glowDot(c,x,y,r){const g=c.createRadialGradient(x,y,0,x,y,r*3.2);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.25,"rgba(120,255,200,.95)");g.addColorStop(.5,ga(.35));g.addColorStop(1,ga(0));c.fillStyle=g;c.beginPath();c.arc(x,y,r*3.2,0,TAU);c.fill()}
function metrics(p){const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));return L}
function pointAt(p,L,d){if(d<=0)return p[0];const T=L[L.length-1];if(d>=T)return p[p.length-1];let i=1;while(L[i]<d)i++;const u=(d-L[i-1])/((L[i]-L[i-1])||1);return[p[i-1][0]+(p[i][0]-p[i-1][0])*u,p[i-1][1]+(p[i][1]-p[i-1][1])*u]}
function strokePart(c,p,L,d){c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){if(L[i]<=d)c.lineTo(p[i][0],p[i][1]);else{const q=pointAt(p,L,d);c.lineTo(q[0],q[1]);break}}c.stroke()}

  const u=scc?clamp((t-scc.start)/Math.max(.5,scc.end-scc.start)):0,cam=(scc?scc.dir:1)*(.6-1.2*u);
  drawBG(t,cam);
  document.getElementById("flat").style.transform=`translate(${cam*-8}px,0)`;
  ST.scenes.forEach((sc,i)=>{const last=i===ST.scenes.length-1;const on=t>=sc.start&&(t<sc.end+.45||last);const s=sc.el.style;
    if(!on){if(s.visibility!=="hidden"){s.visibility="hidden";sizeCv(sc.cb,0);sizeCv(sc.cf,0)}return}
    s.visibility="visible";sizeCv(sc.cb,1);sizeCv(sc.cf,1);
    const lt=t-sc.start,dur=Math.max(.5,sc.end-sc.start),uu=clamp(lt/dur);
    const pin=eOut(clamp(lt/.5)),q=last?0:clamp((t-sc.end)/.45),qe=q*q;
    const ry=CALM?sc.dir*(.7-1.4*uu):sc.dir*(2.4-4.8*uu),rx=CALM?1:1.5+1*Math.sin(lt*.6),scl=1+(CALM?.025:.05)*uu;
    const z=-520*(1-pin)+480*qe;
    s.opacity=Math.min(pin,1-q);
    s.transform=`translateZ(${z}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${scl})`;
    const bl=(1-pin)*14+qe*18;s.filter=bl>.3?`blur(${bl}px)`:"none";
    sc.anims.forEach(a=>applyAnim(a,clamp((lt-a.d)/a.u)));
    if(sc.focus!=null){const q=eOut(clamp((lt-sc.focus)/.45));
      sc.dims.forEach(e=>{const o=e.style.opacity===""?1:parseFloat(e.style.opacity);e.style.opacity=o*(1-.62*q)});
      const raw=clamp((lt-sc.focus)/.5),k=raw<1?1+.09*Math.sin(Math.PI*raw):1;sc.keys.forEach(e=>{e.style.transform=(e.style.transform||"")+` scale(${k.toFixed(4)})`})}
    // canvases
    const cb=sc.cb.getContext("2d"),cf=sc.cf.getContext("2d");cb.clearRect(0,0,1080,1920);cf.clearRect(0,0,1080,1920);
    sc.fx.forEach(f=>{const c=(f.z==="front"||(f.type==="viz"&&f.z!=="back"))?cf:cb;const l=lt-(f.d||0);if(l<0)return;FX[f.type]&&FX[f.type](c,l,f)});
    // continuous DOM motion
    const fa=CALM?.4:1;sc.floats.forEach(e=>e.style.transform=`${e.dataset.base||""} perspective(1400px) rotateX(${Math.sin(t*.7)*3*fa}deg) rotateY(${Math.cos(t*.5)*4*fa}deg)`);
    if(!CALM)sc.glitch.forEach((e,k)=>{const h=Math.sin(Math.floor(t*14)*12.9898+k*78.233)*43758.5453%1;const on=Math.abs(h)<.12;
      e.style.transform=on?`translateX(${(h*120).toFixed(1)}px) skewX(${(h*30).toFixed(1)}deg)`:"none";e.style.filter=on?"hue-rotate(60deg) brightness(1.3)":"none"});
    if(sc.spin)sc.spin.style.transform=`rotateX(60deg) rotateZ(${-38+lt*7}deg)`;
    sc.movers.forEach(m=>{const o=+m.dataset.o,a=lt*.9+o*2.1;m.style.left=(260+190*Math.cos(a))+"px";m.style.top=(260+190*Math.sin(a))+"px"});
    sc.curs.forEach(g=>{const P=g._pts,n=P.length;const ld=lt-.4,ud=ld<1.4?eOut(clamp(ld/1.4)):.5+.5*Math.cos((ld-1.4)*.8);const fi=ud*(n-1),i0=Math.floor(fi),i1=Math.min(n-1,i0+1),f=fi-i0;
      const x=P[i0][0]+(P[i1][0]-P[i0][0])*f,y=P[i0][1]+(P[i1][1]-P[i0][1])*f,v=P[i0][2]+(P[i1][2]-P[i0][2])*f;g.style.opacity=ld>0?1:0;
      const L=g.querySelector(".cl");L.setAttribute("x1",x);L.setAttribute("x2",x);L.setAttribute("y1",g.dataset.top);L.setAttribute("y2",g.dataset.bot);
      const C=g.querySelector(".cc");C.setAttribute("cx",x);C.setAttribute("cy",y);
      const bx=Math.min(x+16,700),by=y-70;g.querySelector(".cb").setAttribute("x",bx);g.querySelector(".cb").setAttribute("y",by);
      const T=g.querySelector(".ct");T.setAttribute("x",bx+12);T.setAttribute("y",by+31);T.textContent=v.toFixed(1)});
  });
  drawFG(t,cam);
  if(ST.cam)drawCam(t,cur);
  // HUD
  document.querySelector("#prog i").style.width=(100*clamp(t/ST.total))+"%";
  const tc=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${(s%60).toFixed(2).padStart(5,"0")}`;
  document.getElementById("hudL").innerHTML=`<b style="opacity:${Math.floor(t*2)%2?1:.25}">●</b> REC  SCN-${String(Math.max(1,cur+1)).padStart(2,"0")}`;
  document.getElementById("hudR").textContent=`T+${tc(t)} / ${tc(ST.total)}`;
  document.getElementById("railL").style.backgroundPosition=`0 ${(t*40)%22}px`;document.getElementById("railR").style.backgroundPosition=`0 ${-(t*40)%22}px`;
  // cut flash
  let fl=0;if(!CALM)ST.scenes.forEach((sc,i)=>{if(i>0){const d=t-sc.start;if(d>=0&&d<.35)fl=Math.max(fl,.35*(1-d/.35))}});document.getElementById("flash").style.opacity=fl;
  // subtitle
  const sub=document.querySelector("#sub div");let Ln=null;for(const l of ST.lines){if(t>=l.start)Ln=l;else break}
  if(Ln&&t<Ln.end+.05){if(sub.dataset.k!==String(Ln.start)){sub.innerHTML=hl(Ln.text);sub.dataset.k=String(Ln.start)}
    const p=clamp((t-Ln.start)/.14);sub.style.opacity=p;sub.style.transform=`translateY(${(1-eOut(p))*14}px) scale(${.96+.04*eOut(p)})`}else sub.style.opacity=0;
  if(typeof DEC!=="undefined"&&DEC)return DEC;
};
